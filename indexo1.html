            <div class="row"><span class="label">Mandal</span><span class="value">${info.loc.mandal}</span></div>
            <div class="row"><span class="label">Habitation</span><span class="value">${info.loc.habitation}</span></div>
            <div class="row"><span class="label">Coordinates</span><span class="value">${info.loc.coords}</span></div>
            <button class="btn primary" onclick="map.setView([${device.lat},${device.lng}],18)"><i class="fas fa-crosshairs"></i> Center on Map</button>
          </div>
          <div class="card">
            <h4><i class="fas fa-sliders"></i> FLOW CONTROL (FIREBASE SYNC)</h4>
            <button class="btn success" onclick="setValveFlow('${device.id}', false)" ${!device.active ? 'disabled' : ''}><i class="fas fa-check"></i> Open Valve</button>
            <button class="btn danger" onclick="setValveFlow('${device.id}', true)" ${device.active ? 'disabled' : ''}><i class="fas fa-ban"></i> Close Valve</button>
          </div>
          <div class="card">
            <h4><i class="fas fa-history"></i> HISTORY (FIREBASE)</h4>
            <p style="font-size:13px;color:var(--muted);margin-bottom:12px">${device.history.length} records in Firebase</p>
            <button class="btn primary" onclick="showHistory('${device.id}', 'valve')"><i class="fas fa-table"></i> View Full History</button>
          </div>
          <div class="card">
            <h4><i class="fas fa-tools"></i> ACTIONS</h4>
            <button class="btn" onclick="editValve('${device.id}')"><i class="fas fa-pen"></i> Edit Valve</button>
            <button class="btn danger" onclick="deleteValve('${device.id}')"><i class="fas fa-trash"></i> Delete from Firebase</button>
          </div>
        `;
      }
      
      sidebar.classList.add('open');
    }

    async function showHistory(deviceId, type){
      const device = type === 'tank' ? tanks.find(t => t.id === deviceId) : valves.find(v => v.id === deviceId);
      if(!device) return;

      // Load history from Firebase
      device.history = await FirebaseService.loadHistory(deviceId, type === 'tank' ? 'tanks' : 'valves');

      openModal('historyModal');
      setText('historyModalTitle', `${device.name} - History (Firebase)`);
      document.getElementById('historyModal').setAttribute('data-device-id', deviceId);
      document.getElementById('historyModal').setAttribute('data-device-type', type);
      renderHistory(device, type);
    }

    function renderHistory(device, type){
      const content = document.getElementById('historyContent');
      if(device.history.length === 0){
        content.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)">No historical data in Firebase yet. Data is collected every 5 minutes.</div>';
        return;
      }

      const sortedHistory = [...device.history].sort((a, b) => b.timestamp - a.timestamp);

      if(type === 'tank'){
        content.innerHTML = `
          <table class="history-table">
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Water Level</th>
                <th>Pressure</th>
                <th>Flow Rate</th>
                <th>pH</th>
                <th>Temperature</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${sortedHistory.map(record => `
                <tr>
                  <td>${new Date(record.timestamp).toLocaleString()}</td>
                  <td>${record.waterLevel} m</td>
                  <td>${record.pressure} PSI</td>
                  <td>${record.flowRate} L/min</td>
                  <td>${record.pH}</td>
                  <td>${record.temperature}°C</td>
                  <td>${record.status}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } else {
        content.innerHTML = `
          <table class="history-table">
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Valve State</th>
                <th>Active</th>
                <th>Battery</th>
                <th>Pressure</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${sortedHistory.map(record => `
                <tr>
                  <td>${new Date(record.timestamp).toLocaleString()}</td>
                  <td>${record.valveState}</td>
                  <td>${record.active ? 'Yes' : 'No'}</td>
                  <td>${record.battery}%</td>
                  <td>${record.pressure} PSI</td>
                  <td>${record.status}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }
    }

    function filterHistory(){
      const deviceId = document.getElementById('historyModal').getAttribute('data-device-id');
      const deviceType = document.getElementById('historyModal').getAttribute('data-device-type');
      const device = deviceType === 'tank' ? tanks.find(t => t.id === deviceId) : valves.find(v => v.id === deviceId);
      if(!device) return;

      const startDate = document.getElementById('historyStartDate').value;
      const endDate = document.getElementById('historyEndDate').value;

      let filtered = [...device.history];

      if(startDate){
        const start = new Date(startDate).getTime();
        filtered = filtered.filter(r => r.timestamp >= start);
      }

      if(endDate){
        const end = new Date(endDate).getTime();
        filtered = filtered.filter(r => r.timestamp <= end);
      }

      const tempDevice = {...device, history: filtered};
      renderHistory(tempDevice, deviceType);
      toast(`✓ Showing ${filtered.length} records from Firebase`);
    }

    function exportHistoryCsv(){
      const deviceId = document.getElementById('historyModal').getAttribute('data-device-id');
      const deviceType = document.getElementById('historyModal').getAttribute('data-device-type');
      const device = deviceType === 'tank' ? tanks.find(t => t.id === deviceId) : valves.find(v => v.id === deviceId);
      if(!device || device.history.length === 0){
        toast('⚠️ No data to export');
        return;
      }

      let csv = '';
      
      if(deviceType === 'tank'){
        csv = 'Timestamp,Water Level (m),Pressure (PSI),Flow Rate (L/min),pH,Temperature (°C),Status\n';
        device.history.forEach(record => {
          csv += `${new Date(record.timestamp).toISOString()},${record.waterLevel},${record.pressure},${record.flowRate},${record.pH},${record.temperature},${record.status}\n`;
        });
      } else {
        csv = 'Timestamp,Valve State,Active,Battery (%),Pressure (PSI),Status\n';
        device.history.forEach(record => {
          csv += `${new Date(record.timestamp).toISOString()},${record.valveState},${record.active},${record.battery},${record.pressure},${record.status}\n`;
        });
      }

      const blob = new Blob([csv], {type: 'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${device.id}-firebase-history-${Date.now()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast('✓ History exported from Firebase to CSV');
    }

    function closeSidebar(){
      document.getElementById('sidebar').classList.remove('open');
    }

    async function setValveFlow(id, shouldBlock){
      const valve = valves.find(v => v.id === id);
      if(!valve) return;
      
      valve.active = shouldBlock;
      valve.valveState = shouldBlock ? 'closed' : 'open';
      valve.recordHistory();
      
      // Save to Firebase
      await FirebaseService.saveValve(valve);
      
      // Save history to Firebase
      const record = {
        timestamp: Date.now(),
        battery: valve.battery,
        pressure: valve.pressure,
        valveState: valve.valveState,
        active: valve.active,
        status: valve.status
      };
      await FirebaseService.saveHistory(valve.id, 'valves', record);
      
      const affectedPipelines = findAffectedPipelines(valve);
      drawCanvas();
      
      const pipeNames = affectedPipelines.map(p => p.name).join(', ');
      if(shouldBlock){
        toast(`🔴 Valve closed (Firebase synced) - Affected: ${pipeNames || 'None'}`);
      } else {
        toast(`✓ Valve opened (Firebase synced) - Restored: ${pipeNames || 'None'}`);
      }
      
      showDevice(valve, 'valve');
    }

    function findAffectedPipelines(valve){
      const affected = [];
      pipelines.forEach(pipe => {
        for(let i = 0; i < pipe.points.length - 1; i++){
          if(pointOnSegment(valve, pipe.points[i], pipe.points[i+1], POINT_R + 4)){
            affected.push(pipe);
            break;
          }
        }
      });
      return affected;
    }

    // ==================== FLOW CALCULATION ====================
    function isSegmentBlocked(p1, p2){
      return valves.some(v => v.active && pointOnSegment(v, p1, p2, POINT_R + 4));
    }

    function connectedSegments(point, excludePi = -1, excludeSi = -1){
      const results = [];
      pipelines.forEach((pipe, pi) => {
        for(let i = 0; i < pipe.points.length - 1; i++){
          if(pi === excludePi && i === excludeSi) continue;
          const p1 = pipe.points[i], p2 = pipe.points[i + 1];
          if(distanceInPixels(point, p1) < CONNECT_THRESH || distanceInPixels(point, p2) < CONNECT_THRESH){
            results.push({pi, si: i});
          }
        }
      });
      return results;
    }

    function computeFlow(){
      const flow = {p: {}};
      if(tanks.length === 0 || pipelines.length === 0) return flow;

      const starts = [];
      tanks.forEach(tank => {
        pipelines.forEach((pipe, pi) => {
          for(let i = 0; i < pipe.points.length - 1; i++){
            if(pointOnSegment(tank, pipe.points[i], pipe.points[i + 1], 20)){
              starts.push({pi, si: i});
            }
          }
        });
      });

      if(starts.length === 0) return flow;

      const seen = new Set();
      const queue = [...starts];

      while(queue.length > 0){
        const current = queue.shift();
        const key = `${current.pi}-${current.si}`;
        
        if(seen.has(key)) continue;
        seen.add(key);

        const pipe = pipelines[current.pi].points;
        const p1 = pipe[current.si];
        const p2 = pipe[current.si + 1];
        const blocked = isSegmentBlocked(p1, p2);

        if(!flow.p[current.pi]) flow.p[current.pi] = {s: {}};
        flow.p[current.pi].s[current.si] = {hasFlow: !blocked, blocked};

        if(!blocked){
          if(current.si + 1 < pipe.length - 1){
            queue.push({pi: current.pi, si: current.si + 1});
          }
          if(current.si - 1 >= 0){
            queue.push({pi: current.pi, si: current.si - 1});
          }

          [p1, p2].forEach(endpoint => {
            connectedSegments(endpoint, current.pi, current.si).forEach(neighbor => {
              const neighborKey = `${neighbor.pi}-${neighbor.si}`;
              if(!seen.has(neighborKey)){
                queue.push(neighbor);
              }
            });
          });
        }
      }

      pipelines.forEach((pipe, pi) => {
        if(flow.p[pi]){
          const flowingSegments = Object.values(flow.p[pi].s).filter(s => s.hasFlow).length;
          const totalSegments = pipe.points.length - 1;
          pipe.currentFlow = totalSegments > 0 ? (flowingSegments / totalSegments) * pipe.capacity : 0;
        } else {
          pipe.currentFlow = 0;
        }
      });

      return flow;
    }

    // ==================== DRAWING ====================
    function startAnimationLoop(){
      requestAnimationFrame(function loop(){
        drawCanvas();
        requestAnimationFrame(loop);
      });
    }

    function drawCanvas(){
      if(!ctx || !map) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const flow = computeFlow();

      pipelines.forEach((pipe, pi) => {
        for(let i = 0; i < pipe.points.length - 1; i++){
          const p1 = pipe.points[i];
          const p2 = pipe.points[i + 1];
          const stat = flow.p[pi]?.s[i];
          const hasFlow = !!stat?.hasFlow;
          const blocked = !!stat?.blocked;
          const connected = stat !== undefined;

          let color = '#b0b9c4';
          let glow = 'rgba(176,185,196,0.4)';
          let lineWidth = LINE_W;
          
          if(connected){
            if(blocked){
              color = '#d32f2f';
              glow = 'rgba(211,47,47,0.6)';
            } else if(hasFlow){
              color = '#1e88e5';
              glow = 'rgba(30,136,229,0.6)';
            }
          }
          
          // Highlight segment on hover in erase mode
          if(mode === 'erase' && hoveredDevice?.type === 'pipeline'){
            const hoveredPipe = hoveredDevice.data.pipe;
            const hoveredSegment = hoveredDevice.data.segmentIndex;
            if(hoveredPipe.id === pipe.id && hoveredSegment === i){
              color = '#ff6b6b';
              glow = 'rgba(255,107,107,0.8)';
              lineWidth = LINE_W + 2;
            }
          }

          const a = latLngToPixel(p1);
          const b = latLngToPixel(p2);

          ctx.shadowColor = glow;
          ctx.shadowBlur = 14;
          ctx.strokeStyle = color;
          ctx.lineWidth = lineWidth;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          
          ctx.shadowBlur = 0;
        }

        if(pipe.currentFlow > 0 && pipe.points.length > 0){
          const midPoint = pipe.points[Math.floor(pipe.points.length / 2)];
          const px = latLngToPixel(midPoint);
          
          ctx.fillStyle = 'rgba(30,136,229,0.9)';
          ctx.font = 'bold 11px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          ctx.shadowColor = 'rgba(0,0,0,0.3)';
          ctx.shadowBlur = 4;
          
          const flowText = `${pipe.currentFlow.toFixed(0)} L/min`;
          ctx.fillText(flowText, px.x, px.y - 12);
          
          ctx.shadowBlur = 0;
        }
      });

      if(currentPipeline.length > 1){
        ctx.strokeStyle = '#9aa7b5';
        ctx.lineWidth = LINE_W;
        ctx.shadowColor = 'rgba(154,167,181,0.5)';
        ctx.shadowBlur = 12;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const start = latLngToPixel(currentPipeline[0]);
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        
        for(let i = 1; i < currentPipeline.length; i++){
          const p = latLngToPixel(currentPipeline[i]);
          ctx.lineTo(p.x, p.y);
        }
        
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      valves.forEach(valve => {
        const p = latLngToPixel(valve);
        const hovered = hoveredDevice?.device === valve;
        const scale = hovered ? 1.2 : 1.0;

        ctx.shadowColor = valve.active ? 'rgba(211,47,47,0.7)' : 'rgba(106,27,154,0.7)';
        ctx.shadowBlur = 20;
        ctx.fillStyle = valve.active ? 'rgba(211,47,47,0.15)' : 'rgba(106,27,154,0.15)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, (POINT_R + 6) * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = valve.active ? '#d32f2f' : '#6a1b9a';
        ctx.beginPath();
        ctx.arc(p.x, p.y, POINT_R * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, POINT_R * scale, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.shadowBlur = 0;
      });

      tanks.forEach(tank => {
        const p = latLngToPixel(tank);
        const hovered = hoveredDevice?.device === tank;
        const scale = hovered ? 1.2 : 1.0;

        ctx.shadowColor = 'rgba(0,137,123,0.7)';
        ctx.shadowBlur = 24;
        ctx.fillStyle = 'rgba(0,137,123,0.15)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, (POINT_R + 8) * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#00897b';
        ctx.beginPath();
        ctx.arc(p.x, p.y, (POINT_R + 2) * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, (POINT_R + 2) * scale, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.shadowBlur = 0;
      });
    }

    // ==================== UTILITY FUNCTIONS ====================
    function bindBtn(id, fn){
      const el = document.getElementById(id);
      if(el) el.addEventListener('click', fn);
    }

    function setActive(id, active){
      const el = document.getElementById(id);
      if(el) el.classList.toggle('active', active);
    }

    function setText(id, text){
      const el = document.getElementById(id);
      if(el) el.textContent = text;
    }

    function setValue(id, value){
      const el = document.getElementById(id);
      if(el) el.value = value;
    }

    function val(id){
      const el = document.getElementById(id);
      return el ? el.value : '';
    }

    function openModal(id){
      const el = document.getElementById(id);
      if(el) el.classList.add('active');
    }

    function closeModal(id){
      const el = document.getElementById(id);
      if(el){
        el.classList.remove('active');
        
        if(id === 'pipelineModal' && mode === 'pipeline'){
          map.dragging.disable();
          map.scrollWheelZoom.disable();
        }
      }
    }

    function toast(message){
      const toastEl = document.getElementById('toast');
      toastEl.textContent = message;
      toastEl.style.display = 'block';
      setTimeout(() => {
        toastEl.style.display = 'none';
      }, 3000);
    }

    function debounce(func, wait){
      let timeout;
      return function executedFunction(...args){
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    function eventToPixel(e){
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function pixelToLatLng(pixel){
      const point = map.containerPointToLatLng([pixel.x, pixel.y]);
      return {lat: point.lat, lng: point.lng};
    }

    function latLngToPixel(latLng){
      const point = map.latLngToContainerPoint([latLng.lat, latLng.lng]);
      return {x: point.x, y: point.y};
    }

    function distanceBetweenPixels(p1, p2){
      return Math.hypot(p2.x - p1.x, p2.y - p1.y);
    }

    function distanceInPixels(latLng1, latLng2){
      const p1 = latLngToPixel(latLng1);
      const p2 = latLngToPixel(latLng2);
      return distanceBetweenPixels(p1, p2);
    }

    function pointOnSegment(point, a, b, threshold){
      const P = latLngToPixel(point);
      const A = latLngToPixel(a);
      const B = latLngToPixel(b);
      
      const APx = P.x - A.x;
      const APy = P.y - A.y;
      const ABx = B.x - A.x;
      const ABy = B.y - A.y;
      
      const ab2 = ABx * ABx + ABy * ABy;
      if(ab2 === 0) return distanceBetweenPixels(P, A) < threshold;
      
      let t = (APx * ABx + APy * ABy) / ab2;
      t = Math.max(0, Math.min(1, t));
      
      const proj = {
        x: A.x + ABx * t,
        y: A.y + ABy * t
      };
      
      return distanceBetweenPixels(P, proj) < threshold;
    }

    function isOnAnyPipeline(latLng, threshold){
      for(let pipe of pipelines){
        for(let i = 1; i < pipe.points.length; i++){
          if(pointOnSegment(latLng, pipe.points[i - 1], pipe.points[i], threshold)){
            return true;
          }
        }
      }
      return false;
    }

    window.map = map;
    window.editTank = editTank;
    window.editValve = editValve;
    window.deleteTank = deleteTank;
    window.deleteValve = deleteValve;
    window.deletePipeline = deletePipeline;
    window.editPipeline = editPipeline;
    window.centerPipeline = centerPipeline;
    window.viewTank = viewTank;
    window.viewValve = viewValve;
    window.viewDevice = viewDevice;
    window.setValveFlow = setValveFlow;
    window.exportData = exportData;
    window.showHistory = showHistory;
    window.searchByAreaAdvanced = searchByAreaAdvanced;
    window.searchByDeviceId = searchByDeviceId;
  </script>
